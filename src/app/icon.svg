<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile { fill: #ffffff; }  /* --background (light) */
    .mark { fill: #171717; }  /* --foreground (light) */
    .cut  { stroke: #ffffff; } /* --background (light) */
    @media (prefers-color-scheme: dark) {
      .tile { fill: #0a0a0a; }  /* --background (dark) */
      .mark { fill: #ededed; }  /* --foreground (dark) */
      .cut  { stroke: #0a0a0a; } /* --background (dark) */
    }
  </style>

  <rect class="tile" width="64" height="64" rx="14" />
  <path class="mark" d="M32 13 L49 20 V33 C49 43.5 42 50 32 56 C22 50 15 43.5 15 33 V20 Z" />
  <path
    class="cut"
    d="M24 33 L29 38 L40 26"
    fill="none"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>